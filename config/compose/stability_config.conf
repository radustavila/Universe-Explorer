// Classes the Compose compiler should treat as stable although it cannot infer it.
// Wired into every Compose module by AndroidComposeConventionPlugin.
//
// :core:model is a pure Kotlin JVM module without the Compose compiler, so its immutable data
// classes are otherwise inferred unstable wherever a feature module reads them.
com.radustavila.nasaexplorer.core.model.**

// Read models :core:domain hands straight to the UI (pure Kotlin JVM, same reason as above).
com.radustavila.nasaexplorer.core.domain.model.*
com.radustavila.nasaexplorer.core.domain.sky.IssPassForecast
com.radustavila.nasaexplorer.core.domain.sky.IssTrack
com.radustavila.nasaexplorer.core.domain.search.UniversalSearchResults
com.radustavila.nasaexplorer.core.domain.search.SearchResultGroup

// Immutable value types (LocalDate, Instant, Duration, ZonedDateTime, ...).
java.time.*

// Read-only collection interfaces. UI state only ever holds lists the ViewModel built and never
// mutates afterwards; nothing casts them back to a mutable type.
kotlin.collections.*
